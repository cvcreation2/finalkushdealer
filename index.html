    <style>
        :root { --primary: #2e7d32; --dark: #1b5e20; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        header { background: var(--dark); color: white; padding: 30px; text-align: center; }
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 100%; }
        .img-box { width: 100%; height: 220px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        h3 { margin: 0 0 10px 0; font-size: 17px; height: 42px; overflow: hidden; color: #111; }
        .desc { font-size: 13px; color: #666; height: 38px; overflow: hidden; margin-bottom: 15px; }
        .prices { background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: auto; }
        .p-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
        .p-row:last-child { border: none; }
        .p-val { font-weight: bold; color: var(--primary); }
    </style>
</head>
